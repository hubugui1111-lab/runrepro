name: Vega Vendor Hidden Bundle

on:
  push:
    branches: [rust-offline-bundle]
    paths:
      - '.github/workflows/vega-vendor-hidden.yml'
  workflow_dispatch:

jobs:
  vendor:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Vendor Vega dependencies
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/vega-offline/src /tmp/vega-offline/.cargo
          cat > /tmp/vega-offline/Cargo.toml <<'TOML'
          [package]
          name = "vega-offline-seed"
          version = "0.1.0"
          edition = "2024"
          publish = false

          [dependencies]
          vega-prover = { git = "https://github.com/microsoft/vega-prover", rev = "c0ee259053cd12eaf43ed71b5cde375452b3ee4d" }
          bellpepper-core = "0.4.0"
          ff = "0.13"
          bincode = "1.3"
          serde_json = "1"
          TOML
          echo 'fn main() {}' > /tmp/vega-offline/src/main.rs
          cd /tmp/vega-offline
          cargo generate-lockfile
          cargo vendor vendor > .cargo/config.toml
          CARGO_NET_OFFLINE=true cargo check --offline
          rm -rf target
          test -f vendor/tracing-core/.cargo-checksum.json
          test -f .cargo/config.toml
          du -sh vendor
      - name: Upload complete vendor tree
        uses: actions/upload-artifact@v4
        with:
          name: vega-vendor-complete
          path: |
            /tmp/vega-offline/Cargo.toml
            /tmp/vega-offline/Cargo.lock
            /tmp/vega-offline/.cargo
            /tmp/vega-offline/vendor
          include-hidden-files: true
          compression-level: 6
          retention-days: 1
