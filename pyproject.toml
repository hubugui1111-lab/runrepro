[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "runrepro"
version = "0.1.0"
description = "Turn a failed GitHub Actions run URL into a safe, inspectable local replay bundle."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "RunRepro contributors" }]
keywords = ["github-actions", "ci", "debugging", "reproducibility", "act"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Debuggers",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "httpx>=0.28,<1",
  "packaging>=24,<27",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0.2,<7",
  "rich>=14,<15",
  "typer>=0.16,<1",
]

[project.urls]
Homepage = "https://github.com/hubugui1111-lab/runrepro"
Documentation = "https://github.com/hubugui1111-lab/runrepro#readme"
Issues = "https://github.com/hubugui1111-lab/runrepro/issues"
Source = "https://github.com/hubugui1111-lab/runrepro"

[project.scripts]
runrepro = "runrepro.cli:app"

[dependency-groups]
dev = [
  "build>=1.3,<2",
  "mypy>=1.17,<3",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
  "types-pyyaml>=6.0.12,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/runrepro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=runrepro",
  "--cov-report=term-missing:skip-covered",
  "--cov-report=xml",
  "--cov-fail-under=80",
]
markers = [
  "integration: exercises multiple RunRepro components",
  "smoke: exercises the installed CLI boundary",
]

[tool.coverage.run]
branch = true
source = ["runrepro"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
pretty = true
